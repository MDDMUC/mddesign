<!-- Icon Sprite - Martin Drexler Portfolio -->
<!-- Based on SVG_PRIMITIVES.md specifications -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Navigation Icons -->
    <symbol id="menu" viewBox="0 0 24 24">
      <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
    </symbol>

    <symbol id="close" viewBox="0 0 24 24">
      <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
    </symbol>

    <symbol id="arrow-right" viewBox="0 0 24 24">
      <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <polyline points="14,6 20,12 14,18" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <symbol id="arrow-left" viewBox="0 0 24 24">
      <line x1="20" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <polyline points="10,6 4,12 10,18" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <symbol id="external-link" viewBox="0 0 24 24">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <polyline points="15,3 21,3 21,9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <line x1="10" y1="14" x2="21" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
    </symbol>

    <symbol id="check" viewBox="0 0 24 24">
      <polyline points="4,12 9,17 20,6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <!-- Service Icons -->
    <symbol id="compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
      <polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <symbol id="grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <symbol id="shapes" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
      <rect x="4" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <polygon points="17,14 21,21 13,21" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <!-- Social Icons -->
    <symbol id="linkedin" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <line x1="8" y1="11" x2="8" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <line x1="8" y1="7" x2="8" y2="7.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <path d="M12 17v-6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <path d="M16 17v-4a2 2 0 0 0-4 0" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <symbol id="mail" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <polyline points="2,4 12,13 22,4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    </symbol>

    <symbol id="location" viewBox="0 0 24 24">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="square"/>
      <circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    </symbol>
  </defs>
</svg>

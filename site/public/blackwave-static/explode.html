<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vessel, taken apart</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #010101; color: #fff; }
    body { font-family: Helvetica, "Helvetica Neue", Arial, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud {
      position: fixed;
      z-index: 2;
      left: 1.5rem;
      top: 1.5rem;
      right: 5rem;
      pointer-events: none;
    }
    .kicker {
      margin: 0 0 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.03rem;
      text-transform: uppercase;
      color: #d8d8d4;
    }
    h1 {
      margin: 0;
      max-width: 14ch;
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }
    .scroll {
      height: 960vh;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="hud">
    <p class="kicker" id="beat">01 · Assembled</p>
    <h1 id="line">The drawing holds.</h1>
  </div>
  <div class="scroll" id="scroll"></div>
  <script type="module" src="explode.js?v=25"></script>
</body>
</html>
